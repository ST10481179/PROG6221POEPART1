name: .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CyberSecurityChatbot/CyberSecurityChatbot.csproj

      - name: Build
        run: dotnet build CyberSecurityChatbot/CyberSecurityChatbot.csproj --configuration Release --no-restore
